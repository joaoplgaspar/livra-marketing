<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Arial;background:#fff}
.row{display:flex;gap:60px;padding:40px 50px;align-items:center}
.dark{background:#000;color:#fff}.light{background:#fff;color:#111}
.op{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:20px}
.big{width:220px;height:220px;border-radius:50%;overflow:hidden}
.mid{width:110px;height:110px;border-radius:50%;overflow:hidden}
.sm{width:40px;height:40px;border-radius:50%;overflow:hidden}
img{width:100%;height:100%;display:block}
.pair{display:flex;gap:24px;align-items:center}
</style></head><body>
<div class="row dark" id="d"></div><div class="row light" id="l"></div>
<script>
for (const id of ['d','l']) for (const k of ['a-papel','b-terracota','c-tinta']) {
  document.getElementById(id).insertAdjacentHTML('beforeend',
   `<div class="op"><div class="pair"><div class="big"><img src="perfil-${k}.svg"></div><div class="mid"><img src="perfil-${k}.svg"></div><div class="sm"><img src="perfil-${k}.svg"></div></div><div>${k}</div></div>`);
}
</script></body></html>
